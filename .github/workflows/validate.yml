name: Validate Paper Radar

on:
  push:
    branches: [main]
    paths: ['ai/**', 'daily_arxiv/**', 'js/**', 'css/**', '*.html', 'tests/**', '.github/workflows/**', 'pyproject.toml', 'uv.lock']
  pull_request:
    paths: ['ai/**', 'daily_arxiv/**', 'js/**', 'css/**', '*.html', 'tests/**', '.github/workflows/**', 'pyproject.toml', 'uv.lock']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Verify recovery, publication and source preservation
        run: |
          uv run python -m unittest discover -s ai/tests -v
          uv run python -m unittest discover -s daily_arxiv/tests -v
      - name: Verify frontend and export helpers
        run: node --test tests/*.test.cjs
