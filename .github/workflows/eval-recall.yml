# 离线评测不同召回方案的召回率与成本；只手动触发，不影响每日抓取流程。
name: eval-recall

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "用于评测的历史日期（过滤前），逗号分隔"
        default: "2026-09-21,2026-09-23"
      limit:
        description: "只评测前 N 篇，0 表示全部"
        default: "0"
      judge_model:
        description: "参考标注用的模型"
        default: "deepseek/deepseek-v4.1-flash"
      jev_model:
        description: "语义判定用的决策模型"
        default: "typesafe/jev-1.13"
      workers:
        description: "并发数"
        default: "8"
  # 也可以提交 eval/RUN_EVAL 来触发一次评测（方便用脚本启动）
  push:
    paths:
      - eval/RUN_EVAL

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose credentials (hosts only, never the key itself)
        run: |
          python3 - <<'PY'
          import os
          import urllib.parse

          def host(name):
              return urllib.parse.urlparse(os.environ.get(name, "")).netloc or "(empty)"

          print("OPENAI_BASE_URL host :", host("OPENAI_BASE_URL"))
          print("JEV_BASE_URL host    :", host("JEV_BASE_URL"))
          print("OPENAI_API_KEY set   :", bool(os.environ.get("OPENAI_API_KEY")))
          print("JEV_API_KEY set      :", bool(os.environ.get("JEV_API_KEY")))
          print("JEV key == OPENAI key:", os.environ.get("JEV_API_KEY") == os.environ.get("OPENAI_API_KEY"))
          PY

      - name: Run recall evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY || secrets.OPENAI_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL || 'https://openrouter.ai/api/v1' }}
        run: |
          set -e
          ARGS=()
          if [ -n "${{ github.event.inputs.dates }}" ]; then ARGS+=(--dates "${{ github.event.inputs.dates }}"); fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS+=(--limit "${{ github.event.inputs.limit }}"); fi
          if [ -n "${{ github.event.inputs.workers }}" ]; then ARGS+=(--workers "${{ github.event.inputs.workers }}"); fi
          if [ -n "${{ github.event.inputs.judge_model }}" ]; then ARGS+=(--judge-model "${{ github.event.inputs.judge_model }}"); fi
          if [ -n "${{ github.event.inputs.jev_model }}" ]; then ARGS+=(--jev-model "${{ github.event.inputs.jev_model }}"); fi
          python3 eval/recall_eval.py "${ARGS[@]}" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --out eval-out

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-eval-report
          path: eval-out/
          if-no-files-found: warn
          retention-days: 30
